name: Build and deploy iLENS website
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private data repository
        uses: actions/checkout@v4
        with:
          repository: iLENS-FURG/ilens-data
          path: _data
          token: ${{ secrets.ILENS_DATA_TOKEN }}
      - name: Checkout private automation repository
        uses: actions/checkout@v4
        with:
          repository: iLENS-FURG/ilens-automation
          path: _automation
          token: ${{ secrets.ILENS_AUTOMATION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r _automation/requirements.txt
      - name: Validate source data
        run: python _automation/scripts/validate_data.py _data
      - name: Run research QA
        run: python _automation/scripts/qa.py _data
      - name: Build knowledge graph
        run: python _automation/scripts/build_graph.py _data
      - name: Generate project scorecard
        run: python _automation/scripts/project_scorecard.py _data
      - name: Generate website data and research index
        run: python _automation/scripts/generate_content.py _data .
      - name: Generate static research API
        run: python _automation/scripts/generate_api.py _data static/api
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.151.0'
          extended: true
      - name: Build Hugo site
        run: hugo --minify
      - name: Check generated site links
        run: python _automation/scripts/check_links.py public || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
