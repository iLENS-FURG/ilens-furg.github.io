{{ $items := site.Data.generated.institutions | default (slice) }}
<div class="filter-bar">
  <input data-filter-input placeholder="Search institutions…">
  <select data-filter-select data-filter-key="type">
    <option value="all">All types</option>
    <option value="university">Universities</option>
    <option value="funder">Funders</option>
    <option value="research-organization">Research organizations</option>
    <option value="internet-infrastructure">Internet infrastructure</option>
  </select>
  <span class="filter-count" data-filter-count></span>
</div>

<div class="institution-grid">
  {{ range $item := $items }}
  <a class="institution-card"
     data-filter-item
     data-type="{{ $item.type }}"
     data-search="{{ $item.name.short }} {{ $item.name.official }} {{ $item.country }}"
     href="{{ printf "/institutions/%s/" $item.id | relURL }}">
    <div class="institution-logo">
      {{ with $item.logo.light }}
        <img src="{{ . | relURL }}" alt="{{ $item.name.short }} logo">
      {{ else }}
        <span>{{ substr $item.name.short 0 1 }}</span>
      {{ end }}
    </div>
    <div>
      <h3>{{ $item.name.short }}</h3>
      <p>{{ $item.name.official }}</p>
      <small>{{ $item.country }}</small>
    </div>
  </a>
  {{ end }}
</div>

<div class="search-empty" data-filter-empty>
  No institutions match your search.
</div>
