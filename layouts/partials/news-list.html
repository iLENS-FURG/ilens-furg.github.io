{{ $items := site.Data.generated.news | default (slice) }}<div class="news-grid">{{ range sort $items "date" "desc" }}{{ if eq .status "published" }}<article class="news-card"><div class="news-date">{{ .date }}</div><h3>{{ .title }}</h3><p>{{ .summary }}</p>{{ with .project }}<a class="learn" href="{{ printf "/projects/%s/" . | relURL }}">View project →</a>{{ end }}</article>{{ end }}{{ end }}</div>
