<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="{{ .Description | default .Site.Params.description }}">
<meta property="og:title" content="{{ .Title }} · iLENS"><meta property="og:description" content="{{ .Description | default .Site.Params.description }}"><meta property="og:type" content="website">
<meta property="og:image" content="{{ "images/logo-mark.svg" | absURL }}"><meta name="theme-color" content="#061f38">
<link rel="canonical" href="{{ .Permalink }}"><title>{{ if .Title }}{{ .Title }} · {{ end }}iLENS</title>
<link rel="icon" href="{{ "images/logo-mark.svg" | relURL }}" type="image/svg+xml"><link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>
<body>{{ partial "header.html" . }}<main id="main-content">{{ block "main" . }}{{ end }}</main>{{ partial "footer.html" . }}<script src="{{ "js/site.js" | relURL }}" defer></script>{{ partial "analytics.html" . }}
</body>
</html>
